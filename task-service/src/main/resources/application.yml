spring:
  application:
    name: task-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8090/realms/personal-workspace}
          jwk-set-uri: ${OAUTH2_JWK_SET_URI:http://localhost:8090/realms/personal-workspace/protocol/openid-connect/certs}

security:
  jwt:
    audience: ${OAUTH2_AUDIENCE:workspace-api}
  datasource:
    url: ${DB_URL:jdbc:h2:mem:taskdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Schema do Flyway quản lý; Hibernate chỉ xác minh entity khớp database.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

server:
  # PER-25 yêu cầu Task Service chạy độc lập ở cổng 8081.
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        # Chỉ public đúng hai endpoint được ticket yêu cầu; không expose toàn bộ actuator.
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  application:
    name: ${spring.application.name}
    description: Personal Workspace task and todo management service
    version: "@project.version@"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    display-request-duration: true
