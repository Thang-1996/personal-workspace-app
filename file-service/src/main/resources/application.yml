spring:
  application.name: file-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:filedb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  servlet.multipart:
    max-file-size: ${FILE_MAX_SIZE:20MB}
    max-request-size: ${FILE_MAX_SIZE:20MB}
  security.oauth2.resourceserver.jwt:
    issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8090/realms/personal-workspace}
    jwk-set-uri: ${OAUTH2_JWK_SET_URI:http://localhost:8090/realms/personal-workspace/protocol/openid-connect/certs}
server.port: ${SERVER_PORT:8082}
security.jwt.audience: ${OAUTH2_AUDIENCE:workspace-api}
storage:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:workspace-files}
  max-size-bytes: ${FILE_MAX_SIZE_BYTES:20971520}
  allowed-types: ${FILE_ALLOWED_TYPES:application/pdf,image/png,image/jpeg,text/plain}
management.endpoints.web.exposure.include: health,info
